<script>
(function () {
  // Strip invisible Unicode marks (RTL/LTR/zero-width) that some keyboards
  // append to a typed URL, then redirect to the clean path if it changed.
  try {
    var junk = /[​-‏‪-‮⁦-⁩﻿]/g;
    var path = decodeURIComponent(location.pathname).replace(junk, '');
    // also drop a stray trailing slash on file-style paths
    var cleanPath = path;
    if (cleanPath !== decodeURIComponent(location.pathname)) {
      location.replace(location.origin + encodeURI(cleanPath) + location.search + location.hash);
    }
  } catch (e) {}
})();
</script>

<!-- ═══════ META PIXEL (Z90) — נטען רק לאחר הסכמה לעוגיות שיווקיות ═══════ -->
<script>
(function(){
  var Z90_PIXEL_ID = '931255999991314';
  window.z90LoadMetaPixel = function(){
    if (window.fbq) return; // הגנה מפני התקנה כפולה
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', Z90_PIXEL_ID);
    fbq('track', 'PageView');
  };
  window.z90TrackLead = function(formId){
    try {
      window.__z90LeadFired = window.__z90LeadFired || {};
      var key = formId || 'lead';
      if (window.__z90LeadFired[key]) return; // מונע שליחת Lead כפולה
      window.__z90LeadFired[key] = true;
      if (window.fbq) { fbq('track', 'Lead'); }
    } catch(e){}
  };
  try {
    if (localStorage.getItem('z90_cookie_consent') === 'all') { window.z90LoadMetaPixel(); }
  } catch(e){}
})();
</script>
